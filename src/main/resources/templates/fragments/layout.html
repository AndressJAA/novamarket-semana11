<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NOVA Market, gestión de pedidos y descuentos comerciales.">
    <title th:text="${pageTitle + ' · NOVA Market'}">NOVA Market</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<aside class="sidebar" id="app-sidebar" th:fragment="sidebar(activePage)" aria-label="Navegación principal">
    <div class="brand">
        <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" role="img">
                <path d="M8 29V11h6l12 13V11h6v18h-6L14 16v13H8Z"/>
            </svg>
        </span>
        <span class="brand-copy">
            <strong>NOVA</strong>
            <small>Market</small>
        </span>
    </div>

    <nav class="sidebar-nav">
        <p class="nav-label">Operaciones</p>
        <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? 'is-active'" class="nav-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/orders}" th:classappend="${activePage == 'orders'} ? 'is-active'" class="nav-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4V2h2v2h6V2h2v2h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6c0-1.1.9-2 2-2h3Zm13 7H4v9h16v-9ZM6 13h5v5H6v-5Z"/></svg>
            <span>Pedidos</span>
        </a>
        <a th:href="@{/orders/new}" th:classappend="${activePage == 'new-order'} ? 'is-active'" class="nav-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
            <span>Nuevo pedido</span>
        </a>
        <a th:href="@{/events}" th:classappend="${activePage == 'events'} ? 'is-active'" class="nav-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6l-2 3-2-3H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2Zm0 2v12h7.1l.9 1.4.9-1.4H20V5H4Zm3 3h10v2H7V8Zm0 4h7v2H7v-2Z"/></svg>
            <span>Eventos y notificaciones</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
            <strong>Sistema operativo</strong>
            <small>Persistencia en memoria</small>
        </div>
    </div>
</aside>

<header class="topbar" th:fragment="topbar(pageTitle, pageDescription)">
    <button class="menu-button" type="button" data-menu-toggle aria-controls="app-sidebar" aria-expanded="false">
        <span class="sr-only">Abrir navegación</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg>
    </button>
    <div class="topbar-title">
        <h1 th:text="${pageTitle}">Título</h1>
        <p th:text="${pageDescription}">Descripción</p>
    </div>
    <div class="environment-chip" title="Alcance actual del laboratorio">
        <span>Etapa 2</span>
        <strong>Strategy + Observer</strong>
    </div>
</header>

<div th:fragment="scripts">
    <script th:src="@{/js/app.js}" defer></script>
</div>
</body>
</html>
